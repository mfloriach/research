name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest suite
        run: npm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: mongodb://admin:admin123@localhost:27017/epistimology_test?authSource=admin
      MONGODB_DB: epistimology_test
      # Format-validated only; the smoke suite never calls the LLM.
      OPENAI_API_KEY: ci-dummy-key
      JWT_SECRET: ci-dummy-jwt-secret-at-least-32-chars
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Start docker compose services
        # Same atlas-local replica-set image as local dev; only mongodb is
        # needed (no anvil/ipfs). Readiness is covered by db:migrate's
        # waitForPrimary retry loop.
        run: docker compose up -d

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed test database
        run: npm run db:setup

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop docker compose services
        if: always()
        run: docker compose down
