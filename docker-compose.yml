services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: anvil-node
    restart: unless-stopped
    ports:
      - "8545:8545"
    entrypoint:
      - anvil
      - --host
      - "0.0.0.0"
      - --port
      - "8545"

  ipfs:
    image: ipfs/kubo:latest
    container_name: epistimology-ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs-data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongodb:
    image: mongodb/mongodb-atlas-local:7
    container_name: epistimology-mongodb
    hostname: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - mongodb-mongot:/data/mongot

  mongo-express:
    image: mongo-express:latest
    container_name: epistimology-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: webuser
      ME_CONFIG_BASICAUTH_PASSWORD: webpassword
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb-data:
  mongodb-config:
  mongodb-mongot:
  ipfs-data:
