openapi: 3.0.0
info:
  title: Epistimology API
  version: 1.0.0
  description: >-
    Reporting and argument-audit API: debates, full-text content, full-text search logging, and audit items
    (contraarguments, fallacies, evidences, sources, interpretations).
paths:
  /articles/{id}/open:
    post:
      operationId: post-articles-{id}-open
      summary: Record an article open
      description: Increments the open count for a reporting article.
      tags:
        - Articles
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
            description: Article ID
          description: Article ID
          example: '123'
      responses:
        '200':
          description: Open count incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleOpenResponse'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /content:
    get:
      operationId: get-content
      summary: Get the full page content
      description: Reads the site, heading, reporting and audit content from
      tags:
        - Content
      parameters: []
      responses:
        '200':
          description: Full page content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResponse'
        '500':
          description: Content unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /audits/contraarguments:
    post:
      operationId: post-audits-contraarguments
      summary: Create a contraargument audit item
      description: Validates the audit item payload, pins it to IPFS, splits
      tags:
