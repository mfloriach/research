      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebateInput'
        required: true
      responses:
        '201':
          description: Report stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebateResponse'
        '400':
