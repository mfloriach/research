      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditItemInput'
        required: true
      responses:
        '201':
          description: Contraargument created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditItemResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Storage failed
          content:
            application/json:
