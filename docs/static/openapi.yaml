      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
            description: Audit item ID
          description: Audit item ID
          example: '123'
      responses:
        '200':
          description: Open count incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContraargumentOpenResponse'
        '404':
          description: Contraargument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /debates:
    post:
      operationId: post-debates
      summary: Create a debate report
      description: Pins the report to IPFS, then stores it as an article with
      tags:
