        '500':
          description: Storage failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /audits/fallacies/{id}/open:
    post:
      operationId: post-audits-fallacies-{id}-open
      summary: Record a fallacy open
      description: Increments the open count for a fallacy item.
      tags:
        - Fallacies
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
            description: Audit item ID
          description: Audit item ID
          example: '123'
      responses:
        '200':
          description: Open count incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FallacyOpenResponse'
        '404':
          description: Fallacy not found
          content:
