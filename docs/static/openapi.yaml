tags:
  - name: Articles
  - name: Content
  - name: Contraarguments
  - name: Debates
  - name: Evidences
  - name: Fallacies
  - name: Interpretations
  - name: Search
  - name: Sources
servers:
  - url: ''
    description: API server
components:
  schemas:
    Argument:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        labels:
          type: array
          items:
            type: string
      required:
        - title
        - description
        - labels
    ArticleOpenResponse:
      type: object
      properties:
        articleId:
          type: string
          description: Article ID
        openCount:
          type: number
          description: Open count after increment
      required:
        - articleId
        - openCount
    ArticlePathParams:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          description: Article ID
      required:
        - id
    auditCreateFormSchema:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 20000
        author:
          type: string
          maxLength: 120
          default: ''
        date:
          type: string
          default: ''
      required:
        - title
        - content
    AuditItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        date:
          type: string
        paragraphs:
          type: array
          items:
            type: string
        openCount:
          type: number
      required:
        - id
        - title
        - paragraphs
        - openCount
    AuditItemInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          description: Audit item title, 3-200 characters
        content:
          type: string
          minLength: 1
          maxLength: 20000
          description: Markdown body. Blank-line separated paragraphs become stored paragraphs.
        author:
          type: string
          maxLength: 120
          description: Author display name, at most 120 characters
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Item date in YYYY-MM-DD format
        paragraphIds:
          type: array
          items:
            type: string
            minLength: 1
          description: Reporting paragraph IDs to link this item to
      required:
        - title
        - content
        - author
        - date
    AuditItemPathParams:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          description: Audit item ID
      required:
        - id
    AuditItemResponse:
      type: object
      properties:
        itemId:
          type: string
          description: Created audit item ID
        tab:
          type: string
          description: Audit tab label the item was stored under
        ipfsCid:
          type: string
          description: IPFS CID of the pinned item envelope
      required:
        - itemId
        - tab
        - ipfsCid
    AuditTab:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        author:
          type: string
        date:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditItem'
      required:
        - id
        - label
        - items
    ContentResponse:
      type: object
      properties:
        argument:
          allOf:
            - $ref: '#/components/schemas/Argument'
          description: Debated argument copy
        reportingCard:
          type: object
          properties:
            title:
              type: string
            tabs:
              type: array
              items:
                $ref: '#/components/schemas/ReportingTab'
          required:
            - title
            - tabs
          description: Reporting articles grouped by tab
        auditCard:
          type: object
          properties:
            title:
              type: string
            tabs:
              type: array
              items:
                $ref: '#/components/schemas/AuditTab'
          required:
            - title
            - tabs
          description: Audit items grouped by tab
      required:
        - argument
        - reportingCard
        - auditCard
    ContraargumentOpenResponse:
      type: object
      properties:
        contraargumentId:
          type: string
          description: Contraargument item ID
        openCount:
          type: number
          description: Open count after increment
      required:
        - contraargumentId
        - openCount
    DebateInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          description: Report title, 3-200 characters
        labels:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 60
          description: Article labels. The article appears under every matching reporting tab.
        description:
          type: string
          minLength: 1
          maxLength: 20000
          description: Markdown report body. Blank-line separated paragraphs become stored paragraphs.
      required:
        - title
        - description
    DebateResponse:
      type: object
      properties:
        articleId:
          type: string
          description: Created reporting article ID
        tabs:
          type: array
          items:
            type: string
          description: Reporting tabs the article was stored under
        paragraphIds:
          type: array
          items:
            type: string
          description: Stored paragraph IDs in document order
        ipfsCid:
          type: string
          description: IPFS CID of the pinned report envelope
      required:
        - articleId
        - tabs
        - paragraphIds
        - ipfsCid
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
      required:
        - error
    EvidenceOpenResponse:
      type: object
      properties:
        evidenceId:
          type: string
          description: Evidence item ID
        openCount:
          type: number
          description: Open count after increment
      required:
        - evidenceId
        - openCount
    FallacyOpenResponse:
      type: object
      properties:
        fallacyId:
          type: string
          description: Fallacy item ID
        openCount:
          type: number
          description: Open count after increment
      required:
        - fallacyId
        - openCount
    InterpretationOpenResponse:
      type: object
      properties:
        interpretationId:
          type: string
          description: Interpretation item ID
        openCount:
          type: number
          description: Open count after increment
      required:
        - interpretationId
        - openCount
    reportCreateFormSchema:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        labels:
          type: string
          default: ''
        description:
          type: string
          minLength: 1
          maxLength: 20000
      required:
        - title
        - description
    ReportingArticle:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        labels:
          type: array
          items:
            type: string
        author:
          type: string
        date:
          type: string
        authorAddress:
          type: string
        openCount:
          type: number
        paragraphs:
          type: array
          items:
            $ref: '#/components/schemas/ReportingParagraph'
      required:
        - id
        - title
        - labels
        - openCount
        - paragraphs
    ReportingParagraph:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        auditItemIds:
          type: array
          items:
            type: string
      required:
        - id
        - text
        - auditItemIds
    ReportingTab:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportingArticle'
      required:
        - id
        - label
        - items
    SearchQuery:
      type: object
      properties:
        q:
          type: string
          description: Full-text search query. Truncated server-side to 200 characters.
    SearchResponse:
      type: object
      properties:
        query:
          type: string
          description: Query after server-side truncation
        match:
          type: boolean
          description: Whether the top similarity reached 70%
        score:
          type: number
          description: Top cosine similarity score
        matches:
          type: array
          items:
            type: object
            properties:
              articleId:
                type: string
                description: Matched article ID
              score:
                type: number
                description: Cosine similarity score
            required:
              - articleId
              - score
          description: Top vector matches in rank order
        answer:
          type: string
          description: LLM answer for the query
        model:
          type: string
          description: LLM model that produced the answer
      required:
        - query
        - match
        - score
        - matches
        - answer
        - model
    SourceOpenResponse:
      type: object
      properties:
        sourceId:
          type: string
          description: Source item ID
        openCount:
          type: number
          description: Open count after increment
      required:
        - sourceId
        - openCount
  responses: {}
