      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditItemInput'
        required: true
      responses:
        '201':
          description: Interpretation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditItemResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Storage failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /audits/interpretations/{id}/open:
    post:
      operationId: post-audits-interpretations-{id}-open
      summary: Record an interpretation open
      description: Increments the open count for an interpretation item.
      tags:
        - Interpretations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            minLength: 1
            description: Audit item ID
          description: Audit item ID
          example: '123'
      responses:
        '200':
          description: Open count incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterpretationOpenResponse'
        '404':
          description: Interpretation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /search:
    get:
      operationId: get-search
      summary: Vector search over articles with an LLM answer
      description: Runs Atlas Vector Search over article embeddings, logs the
      tags:
        - Search
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
            description: Full-text search query. Truncated server-side to 200 characters.
          description: Full-text search query. Truncated server-side to 200 characters.
          example: example
      responses:
        '200':
          description: Search result with LLM answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Search failed
          content:
            application/json:
              schema:
