        '500':
          description: Update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /audits/fallacies:
    post:
      operationId: post-audits-fallacies
      summary: Create a fallacy audit item
      description: Validates the audit item payload, pins it to IPFS, splits
      tags:
