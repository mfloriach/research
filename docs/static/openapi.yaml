      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditItemInput'
        required: true
      responses:
        '201':
          description: Fallacy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditItemResponse'
        '400':
          description: Invalid input
          content:
